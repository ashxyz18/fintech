<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign up — CryptoVault</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="auth-page">

  <div class="auth-form-wrap">
    <div class="auth-form">
      <a href="index.html" class="logo" style="margin-bottom:32px;">
        <span class="logo-mark">CV</span>
        <span>CryptoVault</span>
      </a>
      <h1>Create your account</h1>
      <p class="sub">Start trading crypto, forex, stocks, indices and bonds with AI-powered bots in 60 seconds.</p>

      <div class="form-error" id="err"></div>

      <form id="signupForm">
        <div class="form-row">
          <div class="form-group">
            <label>First name</label>
            <input type="text" id="firstName" required placeholder="Alex" />
          </div>
          <div class="form-group">
            <label>Last name</label>
            <input type="text" id="lastName" required placeholder="Reed" />
          </div>
        </div>

        <div class="form-group">
          <label>Email address</label>
          <input type="email" id="email" required placeholder="you@example.com" />
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" required minlength="6" placeholder="At least 6 characters" />
        </div>

        <div class="form-group">
          <label>Country</label>
          <select id="country" required>
            <option value="">Select a country</option>
            <option>United States</option>
            <option>United Kingdom</option>
            <option>Germany</option>
            <option>France</option>
            <option>Spain</option>
            <option>Italy</option>
            <option>Canada</option>
            <option>Australia</option>
            <option>Japan</option>
            <option>Singapore</option>
            <option>India</option>
            <option>Brazil</option>
            <option>Other</option>
          </select>
        </div>

        <div class="form-group" style="display:flex; align-items:flex-start; gap:10px;">
          <input type="checkbox" id="agree" required style="width:auto; margin-top:4px;" />
          <label for="agree" style="margin:0; font-size:0.85rem;">
            I agree to the <a href="#" class="text-blue">Terms of Service</a> and
            <a href="#" class="text-blue">Privacy Policy</a>, and confirm I'm 18+.
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">
          Create account <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <div class="flex gap-sm mt-lg" style="align-items:center;">
        <div style="flex:1; height:1px; background:var(--border);"></div>
        <span class="text-mute" style="font-size:0.82rem;">OR CONTINUE WITH</span>
        <div style="flex:1; height:1px; background:var(--border);"></div>
      </div>

      <div class="flex gap-sm mt-md">
        <button class="btn btn-ghost btn-block" onclick="demoSocial('Google')"><i class="fa-brands fa-google"></i> Google</button>
        <button class="btn btn-ghost btn-block" onclick="demoSocial('Apple')"><i class="fa-brands fa-apple"></i> Apple</button>
      </div>

      <div class="form-foot">
        Already have an account? <a href="login.html">Sign in</a>
      </div>
    </div>
  </div>

  <div class="auth-visual">
    <video autoplay muted loop playsinline poster="https://images.unsplash.com/photo-1639762681485-074b7f938ba0?w=1600&q=80">
      <source src="https://cdn.pixabay.com/video/2021/10/12/91744-633364769_large.mp4" type="video/mp4" />
    </video>
    <div class="quote">
      <h2>Join 180,000+ traders growing their wealth on autopilot.</h2>
      <p>$2.4B+ traded · 84% AI win rate · Withdraw anytime</p>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
function showErr(msg) {
  const el = document.getElementById('err');
  el.textContent = msg;
  el.classList.add('show');
}
function demoSocial(p) {
  setUser({
    name: 'Demo ' + p,
    email: 'demo@' + p.toLowerCase() + '.com',
    country: 'United States',
  });
  toast('Welcome! Redirecting to dashboard…');
  setTimeout(() => location.href = 'dashboard.html', 800);
}
document.getElementById('signupForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const first = firstName.value.trim();
  const last  = lastName.value.trim();
  const em    = email.value.trim();
  const pw    = password.value;
  const ctry  = country.value;
  if (!first || !last) return showErr('Please enter your full name.');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) return showErr('Please enter a valid email.');
  if (pw.length < 6) return showErr('Password must be at least 6 characters.');
  if (!ctry) return showErr('Please select a country.');

  setUser({ name: `${first} ${last}`, email: em, country: ctry, createdAt: Date.now() });
  // ensure account is seeded for the new user
  getAccount();
  toast('Account created! Redirecting to your dashboard…');
  setTimeout(() => location.href = 'dashboard.html', 900);
});
</script>
</body>
</html>
